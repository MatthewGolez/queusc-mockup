<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F3324">
<title>Sign in to QueuSC</title>
<script src="js/auth.js?v=12"></script>
<script>QueuAuth.redirectIfSignedIn();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</svg>

<main class="login">
  <div class="login-card">
    <div class="login-brand">
      <span class="mark">QueuSC</span>
      <span class="motto">Scientia, Virtus, Devotio</span>
    </div>
    <h1>Choose an account</h1>
    <p class="login-sub" id="login-sub">to continue to 1st Semester enrollment</p>
    <ul class="accounts" id="accounts"></ul>
    <form class="login-form" id="login-form" novalidate>
      <label for="login-email">Use another account</label>
      <div class="login-row">
        <input id="login-email" type="email" placeholder="you@usc.edu.ph" autocomplete="username" spellcheck="false">
        <button class="btn btn-primary" type="submit">Continue</button>
      </div>
      <p class="login-error" id="login-error" role="alert"></p>
    </form>
  </div>
  <p class="login-note">Mock-up for QueuSC, CIS 2102 final project. Sign-in is simulated.</p>
</main>

<script src="js/login.js?v=12"></script>
</body>
</html>
